<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>BLACKOUT — 시설 공간 설계</title>
<style>
:root{--paper:#f4f2ec;--ink:#252c2e;--muted:#747973;--line:#dadbd3;--accent:#147c83;--ui:#fcfcf9;--route:#ba7d34}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:Arial,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button:disabled{cursor:wait;opacity:.6}.app{min-height:100dvh;display:flex;flex-direction:column}.topbar{height:72px;padding:0 32px;display:flex;align-items:center;gap:22px;border-bottom:1px solid var(--line);background:var(--ui)}.brand{font-size:23px;font-weight:800;letter-spacing:-1px}.title{font-size:14px;font-weight:500;display:flex;align-items:center;gap:20px}.title:before{content:"";width:1px;height:20px;background:var(--line)}.top-right{margin-left:auto;display:flex;align-items:center;gap:24px}.draft{font-size:11px;letter-spacing:.06em;color:var(--muted)}.export{border:1px solid #292f30;background:#292f30;color:#fff;padding:10px 17px;border-radius:5px;font-size:12px;display:flex;align-items:center;gap:12px}.export span:first-child{font-size:16px;line-height:1}.toolbar{min-height:62px;display:flex;align-items:center;gap:24px;padding:10px 32px;border-bottom:1px solid var(--line);background:var(--ui);flex-wrap:wrap}.floors{display:flex;align-items:center;background:#eeefe9;padding:3px;border-radius:5px;gap:3px}.floors button{border:0;background:none;padding:9px 15px;border-radius:3px;font-size:12px;color:#747973}.floors button[aria-pressed=true]{color:#fff;background:#313a3b;box-shadow:0 1px 2px #0001}.zones{display:flex;gap:5px;align-items:center}.zones button{background:transparent;border:0;border-radius:4px;padding:8px 10px;font-size:12px;color:#797e78;white-space:nowrap}.zones b{font-size:11px;margin-right:6px;color:#434b4b}.zones button[aria-pressed=true]{background:#e3edE9;color:#1c5f63}.zones button[aria-pressed=true] b{color:#1c5f63}.zone-divider{width:1px;height:20px;background:var(--line);margin:0 5px}.layers{margin-left:auto;display:flex;align-items:center;gap:5px}.layer{display:flex;align-items:center;gap:6px;border:1px solid transparent;background:none;padding:8px;font-size:11px;color:#858a84;border-radius:4px}.layer[aria-pressed=true]{border-color:#dddcd4;background:#f0f1eb;color:#323a39}.dot{width:10px;height:2px;display:block;background:#bcc1ba}.layer[data-layer=route] .dot{background:#ba7d34}.layer[data-layer=power] .dot{background:#248d96}.layer[data-layer=threat] .dot{height:7px;background:#b95d4c;opacity:.7;border-radius:1px}.workspace{position:relative;flex:1;min-height:480px;height:calc(100dvh - 169px);overflow:hidden;background:var(--paper)}.map-heading{position:absolute;left:32px;top:25px;z-index:2;pointer-events:none;display:flex;align-items:center;gap:11px}.floor-code{font:600 12px/1.2 Arial,sans-serif;letter-spacing:.1em;color:#868d86}.map-name{font-size:13px;font-weight:600}.map-name:before{content:"/";color:#a6aaa1;margin-right:11px;font-weight:400}.north{position:absolute;right:35px;top:23px;font-size:11px;color:#8b918a;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}.north span{font-size:26px;font-weight:300;line-height:1}.stage{position:absolute;inset:0;touch-action:none;cursor:grab}.stage.dragging{cursor:grabbing}.stage svg{display:block;width:100%;height:100%;user-select:none}.zoom-tools{position:absolute;right:28px;bottom:22px;display:flex;align-items:center;border:1px solid #d8dad1;border-radius:5px;background:#fcfcf7eF;box-shadow:0 2px 8px #252c2e06;overflow:hidden}.zoom-tools button{width:36px;height:35px;border:0;background:transparent;font-size:19px;color:#636c66}.zoom-tools button:hover{background:#e9ece4}.zoom-tools .fit{width:65px;font-size:11px;border-right:1px solid #e1e3db;border-left:1px solid #e1e3db}.zoom-number{font:10px Arial,sans-serif;color:#989e96;position:absolute;right:174px;bottom:34px}.selection-hint{position:absolute;left:32px;bottom:28px;font-size:11px;color:#949a92;pointer-events:none;max-width:60%}.footer{height:35px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:var(--ui);border-top:1px solid var(--line);font-size:10px;letter-spacing:.02em;color:#8b9288}.footer .live{color:#5e756e}.tooltip{position:absolute;padding:8px 12px;border:1px solid #d8ddd3;border-radius:4px;background:#fcfcf9;box-shadow:0 3px 12px #252c2e0a;font-size:11px;pointer-events:none;z-index:5;display:none}.tooltip b{margin-right:8px}.tooltip.visible{display:block}.plain .topbar,.plain .toolbar,.plain .footer,.plain .map-heading,.plain .selection-hint,.plain .north,.plain .zoom-tools,.plain .zoom-number{display:none}.plain .workspace{height:100dvh}.plain-exit{display:none;position:absolute;top:12px;right:12px;z-index:9;background:#fcfcf9;border:1px solid var(--line);border-radius:4px;font-size:11px;padding:8px 12px}.plain .plain-exit{display:block}kbd{font:inherit;border:1px solid #dcded6;border-radius:3px;padding:2px 4px;background:#f6f7f1;margin-left:5px}.only-plan{border:0;background:none;font-size:11px;color:#7c847a;padding:8px;white-space:nowrap}
@media(max-width:1150px){.toolbar{gap:12px;padding:10px 20px}.topbar{padding:0 20px}.zones button{padding:8px 6px}.layers{gap:0}.layer{padding:7px 5px}.top-right{gap:14px}}
@media(max-width:880px){.toolbar{gap:10px}.layers{margin-left:0}.zones{order:3;width:100%;justify-content:center;gap:9px;border-top:1px solid #e8e9e1;padding-top:8px}.workspace{height:calc(100dvh - 207px)}.title{display:none}.draft{display:none}.topbar{height:60px}.layers{margin-left:auto}.top-right{gap:8px}.map-heading{left:20px}.north{right:22px}.selection-hint{left:20px}.footer{padding:0 20px}.only-plan{display:none}}

@media print{.topbar,.toolbar,.footer,.zoom-tools,.zoom-number,.selection-hint,.tooltip,.north,.plain-exit{display:none!important}.workspace{height:100vh;min-height:0}.map-heading{top:8px}.stage{inset:20px 0 0}}
.layer[data-layer=enemy] .dot{width:7px;height:7px;background:#aa574b;border-radius:50%}.enemy-note{font-size:10px;color:#9b6255;letter-spacing:.03em}.enemy-note[hidden]{display:none}
.layer[data-layer=patrol] .dot{background:transparent;border-top:2px dashed #aa574b}.layer:disabled{cursor:default;opacity:.4}
@media(max-width:540px){.layers{gap:1px}.layers .dot{display:none}.layer{padding:7px 4px}.enemy-note{font-size:9px}.map-heading{gap:8px}}

</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">BLACKOUT</div><div class="title">시설 공간 설계</div>
    <div class="top-right"><span class="draft">검토안 · 축척 미정</span><button class="only-plan" id="plain">도면만 보기</button><button class="export" id="export"><span aria-hidden="true">↓</span><span>PNG 저장</span></button></div>
  </header>
  <nav class="toolbar" aria-label="도면 보기">
    <div class="floors" aria-label="층 선택"><button type="button" data-floor="1" aria-pressed="true">1F 하부층</button><button type="button" data-floor="2" aria-pressed="false">2F 상부층</button></div>
    <div class="zones" aria-label="공간 선택"><button type="button" data-zone="all" aria-pressed="true">전체</button><span class="zone-divider"></span><button type="button" data-zone="A" aria-pressed="false"><b>A</b>진입·관찰</button><button type="button" data-zone="B" aria-pressed="false"><b>B</b>작업장</button><button type="button" data-zone="C" aria-pressed="false"><b>C</b>전력 제어</button><button type="button" data-zone="D" aria-pressed="false"><b>D</b>정비 통로</button><button type="button" data-zone="E" aria-pressed="false"><b>E</b>중앙 시설</button></div>
    <div class="layers" aria-label="도면에 추가 표시"><button type="button" class="layer" data-layer="enemy" aria-pressed="true"><i class="dot"></i>적 배치</button><button type="button" class="layer" data-layer="patrol" aria-pressed="true"><i class="dot"></i>순찰</button><button type="button" class="layer" data-layer="route" aria-pressed="false"><i class="dot"></i>동선</button><button type="button" class="layer" data-layer="power" aria-pressed="false"><i class="dot"></i>전력</button><button type="button" class="layer" data-layer="threat" aria-pressed="false"><i class="dot"></i>위험</button></div>
  </nav>
  <main class="workspace" id="workspace">
    <div class="map-heading"><span class="floor-code" id="floorCode">1F</span><span class="map-name" id="mapName">하부층 전체 배치</span><span class="enemy-note" id="enemyNote">적 배치 후보</span></div>
    <div class="north" aria-hidden="true"><span>↑</span>N</div>
    <div class="stage" id="stage" aria-label="시설 평면도. 마우스로 이동하고 휠로 확대할 수 있습니다."></div>
    <div class="selection-hint" id="hint">구역을 선택하면 확대됩니다</div>
    <div class="zoom-number" id="zoomNumber">100%</div>
    <div class="zoom-tools" aria-label="확대 축소"><button id="zoomOut" aria-label="축소">−</button><button class="fit" id="fit">맞춤</button><button id="zoomIn" aria-label="확대">+</button></div>
    <div class="tooltip" id="tooltip" role="tooltip"></div>
    <button class="plain-exit" id="plainExit">도면 보기 종료 <kbd>Esc</kbd></button>
  </main>
  <footer class="footer"><span id="status" role="status" aria-live="polite">공간 검토안 · 실제 거리와 층고는 미정</span><span id="mapLegend">R 추적 로봇 · T 포탑 · 삼각형은 초기 시선 방향</span></footer>
</div>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const zoneInfo={A:{name:'진입·관찰',floor:1,bounds:[92,194,345,657]},B:{name:'컨테이너 작업장',floor:1,bounds:[370,148,835,707]},C:{name:'전력 제어실',floor:1,bounds:[1132,140,393,685]},D:{name:'상부 정비 통로',floor:2,bounds:[603,145,918,670]},E:{name:'중앙 시설',floor:2,bounds:[85,145,600,600]}};
const floorBounds=[65,132,1475,735];
const transport={S0:{x:170,y:260,w:170,h:100},S2:{x:1370,y:220,w:80,h:140},L1:{x:1020,y:200,w:120,h:90}};
const cargo=[{x:470,y:620,w:105,h:155,id:'C-01'},{x:630,y:680,w:190,h:90,id:'C-02'},{x:465,y:265,w:110,h:195,id:'C-03'},{x:650,y:270,w:180,h:100,id:'C-04'},{x:700,y:500,w:110,h:150,id:'C-05'},{x:790,y:200,w:115,h:65,id:'C-06'}];
// Placement candidates only. Facing is the initial look direction in SVG degrees.
const enemyPlacements=[
  {id:'R1',zone:'B',floor:1,type:'robot',x:615,y:480,facing:135,label:[637,464,'start']},
  {id:'R2',zone:'B',floor:1,type:'robot',x:860,y:620,facing:270,label:[855,670,'end']},
  {id:'R3',zone:'B',floor:1,type:'robot',x:1110,y:580,facing:180,label:[1088,568,'end']},
  {id:'T1',zone:'B',floor:1,type:'turret',x:1100,y:350,facing:130,label:[1073,314,'end']},
  {id:'R4',zone:'C',floor:1,type:'robot',x:1390,y:565,facing:180,label:[1368,591,'end']},
  {id:'R5',zone:'D',floor:2,type:'robot',x:1310,y:460,facing:270,label:[1332,483,'start']},
  {id:'R6',zone:'E',floor:2,type:'robot',x:270,y:470,facing:90,label:[249,450,'end']},
  {id:'R7',zone:'E',floor:2,type:'robot',x:590,y:555,facing:270,label:[569,583,'end']}
];
// Proposed routes use the same map coordinates as walls and equipment.
const enemyPatrols={
  R1:{mode:'loop',points:[[615,480],[615,500],[435,500],[435,250],[615,250]]},
  R2:{mode:'pingpong',points:[[860,620],[860,460],[660,460]]},
  R3:{mode:'loop',points:[[1110,580],[1145,580],[1145,730],[955,730],[955,610],[1110,610]]},
  R4:{mode:'loop',points:[[1390,565],[1380,565],[1380,440],[1210,440],[1210,570],[1390,570]]},
  R5:{mode:'pingpong',points:[[1310,460],[1310,315],[940,315]]},
  R6:{mode:'loop',points:[[270,470],[255,470],[255,630],[150,630],[150,410],[270,410]]},
  R7:{mode:'pingpong',points:[[590,555],[615,555],[615,380],[595,380],[595,300],[485,300]]}
};
const zones1={A:'M120 220H400V820H120Z',B:'M400 180H1170V820H400Z',C:'M1170 180H1480V780H1170Z'};
const zones2={D:'M640 180H1480V780H1240V340H640Z',E:'M120 220H400V180H640V700H120Z'};
const qs=new URLSearchParams(location.search);
const initialZone=zoneInfo[qs.get('zone')]?qs.get('zone'):'all';
const initialFloor=initialZone!=='all'?zoneInfo[initialZone].floor:qs.get('floor')==='2'?2:1;
const state={floor:initialFloor,zone:initialZone,layers:new Set((qs.has('layers')?qs.get('layers'):'enemy,patrol').split(',').filter(x=>['enemy','patrol','route','power','threat'].includes(x))),view:floorBounds.slice(),base:floorBounds.slice(),drag:null,plain:false};
const mapStyle=`
.paper{fill:#f4f2ec}.wall{fill:none;stroke:#30383a;stroke-width:13;stroke-linejoin:miter;stroke-linecap:square}.partition{fill:none;stroke:#394143;stroke-width:8;stroke-linecap:square}.fine{fill:none;stroke:#78817b;stroke-width:1.5}.rail{fill:none;stroke:#5e6965;stroke-width:2}.machine{fill:#7d8680;stroke:#3d4746;stroke-width:1.7}.equipment{fill:#515f5d;stroke:#37433f;stroke-width:1.6}.crate{fill:#acafa3;stroke:#666f66;stroke-width:1.6}.screen{fill:#80b6b4;stroke:#3e7778;stroke-width:1}.label{font:500 15px Arial,'Malgun Gothic',sans-serif;fill:#637069;letter-spacing:.2px}.micro{font:500 11px Arial,'Malgun Gothic',sans-serif;fill:#7b857e;letter-spacing:.4px}.device{font:600 12px Arial,'Malgun Gothic',sans-serif;fill:#45635f;letter-spacing:.7px}.sector{font:600 22px Arial,'Malgun Gothic',sans-serif;fill:#37423c}.sector-sub{font:500 10px Arial,'Malgun Gothic',sans-serif;fill:#92998c;letter-spacing:1.5px}.zone-hit{fill:#4b9990;fill-opacity:0;stroke:none;cursor:pointer}.zone-hit:hover{fill-opacity:.055}.zone-hit:focus{outline:none;stroke:#286e6d;stroke-width:2;stroke-dasharray:7 5;fill-opacity:.055}.zone-hit.selected{fill-opacity:.055}.props,.walls,.labels,.overlay,.underlay{pointer-events:none}.route-line{fill:none;stroke:#bc843e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.82}.route-alt{fill:none;stroke:#bc843e;stroke-width:2.5;stroke-dasharray:8 7;opacity:.7}.power-line{fill:none;stroke:#288c94;stroke-width:2;stroke-dasharray:5 5;opacity:.8}.hazard{fill:#b26856;fill-opacity:.12;stroke:#b26856;stroke-width:1;stroke-dasharray:5 4}.hotspot{fill:#b26c59;stroke:#784d42;stroke-width:1.5}.glass{fill:none;stroke:#80aca5;stroke-width:4}.text-on-steel{fill:#e1e5d9;font:500 10px Arial,sans-serif;letter-spacing:1px}
`;
const enemyStyle='.enemy-body{fill:#fff8ed;stroke:#a85448;stroke-width:2.2}.enemy-id{fill:#984c42;font:700 10px Arial,sans-serif;text-anchor:middle;dominant-baseline:central}.enemy-type{fill:#a05c4e;font:500 13px Arial,Malgun Gothic,sans-serif}.enemy-facing{fill:#a85448;stroke:#fff8ed;stroke-width:1}.enemy-ring{fill:none;stroke:#aa574b;stroke-width:2;stroke-dasharray:4 3}.patrol-track{fill:none;stroke:#aa574b;stroke-width:2;stroke-dasharray:7 6;stroke-linejoin:round;stroke-linecap:round;opacity:.72}.patrol-arrow{fill:none;stroke:#a45247;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.patrol-end{fill:#f4f2ec;stroke:#aa574b;stroke-width:1.5}.patrol-caption{fill:#9b6255;font:500 11px Arial,Malgun Gothic,sans-serif;paint-order:stroke;stroke:#f4f2ec;stroke-width:3;stroke-linejoin:round}';
const defs=`<defs><style>${mapStyle}${enemyStyle}</style>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e3e2d8" stroke-width=".65"/></pattern>
<pattern id="concrete" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="5" cy="9" r=".8" fill="#d3d3c7"/><circle cx="24" cy="29" r=".5" fill="#d2d3c6"/></pattern>
<pattern id="grating" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 0V10M5 0V10" stroke="#b3b9ab" stroke-width=".55"/></pattern>
<pattern id="floor-tile" width="45" height="45" patternUnits="userSpaceOnUse"><rect width="45" height="45" fill="#ecece2"/><path d="M45 0H0V45" fill="none" stroke="#d9ddce" stroke-width=".8"/></pattern>
<pattern id="void-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V12" stroke="#c3c9ba" stroke-width=".7"/></pattern>
<clipPath id="void-clip"><rect x="640" y="340" width="600" height="330"/></clipPath>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#bc843e" stroke-width="1.3"/></marker>
</defs>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
const rect=(x,y,w,h,cl='',attrs='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}"${cl?` class="${cl}"`:''} ${attrs}/>`;
const path=(d,cl='',attrs='')=>`<path d="${d}"${cl?` class="${cl}"`:''} ${attrs}/>`;
const text=(s,x,y,cl='label',attrs='')=>`<text x="${x}" y="${y}" class="${cl}" ${attrs}>${esc(s)}</text>`;
const circle=(x,y,r,cl='',attrs='')=>`<circle cx="${x}" cy="${y}" r="${r}"${cl?` class="${cl}"`:''} ${attrs}/>`;
function box(x,y,w,h,kind='crate') {return rect(x,y,w,h,kind)+path(`M${x+4} ${y+4}L${x+w-4} ${y+h-4}M${x+w-4} ${y+4}L${x+4} ${y+h-4}`,'fine','opacity=".55"');}
function container(o,ghost=false){let s=rect(o.x,o.y,o.w,o.h,'equipment')+rect(o.x+4,o.y+4,o.w-8,o.h-8,'fine');const vertical=o.h>o.w;for(let a=10;a<(vertical?o.w:o.h)-5;a+=12)s+=path(vertical?`M${o.x+a} ${o.y+5}V${o.y+o.h-5}`:`M${o.x+5} ${o.y+a}H${o.x+o.w-5}`,'fine','stroke="#a8b3a2" opacity=".45"');if(!ghost)s+=text(o.id,o.x+o.w/2,o.y+o.h/2+4,'text-on-steel','text-anchor="middle"');return s;}
function consoleUnit(x,y,w=95,h=42){return rect(x,y,w,h,'equipment')+rect(x+6,y+6,w*.57,h-12,'screen')+path(`M${x+w*.73} ${y+10}H${x+w-8}M${x+w*.73} ${y+18}H${x+w-8}M${x+w*.73} ${y+26}H${x+w-8}`,'fine','stroke="#b6c7b5"');}

  const patrol=enemyPatrols[e.id],points=patrol.mode==='loop'?[...patrol.points,patrol.points[0]]:patrol.points;
  let drawing=path('M'+points.map(p=>p.join(' ')).join('L'),'patrol-track');

$('plain').addEventListener('click',()=>setPlain(true));$('plainExit').addEventListener('click',()=>setPlain(false));
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key==='Escape'){if(state.plain)setPlain(false);else selectZone('all');}if(e.key==='1')chooseFloor(1);if(e.key==='2')chooseFloor(2);});
function exportSVG(){const clone=svg.cloneNode(true);clone.removeAttribute('aria-labelledby');clone.removeAttribute('role');clone.querySelectorAll('.zone-hit').forEach(n=>n.remove());clone.querySelectorAll('[tabindex]').forEach(n=>n.removeAttribute('tabindex'));const title=state.zone==='all'?(state.floor===1?'1F 하부층':'2F 상부층'):`${state.zone} ${zoneInfo[state.zone].name}`;const inner=clone.innerHTML;const patrol=state.layers.has('enemy')&&state.layers.has('patrol');const draft=state.layers.has('enemy')?(patrol?'배치·순찰 후보 · 축척 미정':'적 배치 후보 · 축척 미정'):'검토안 · 축척 미정';const key=patrol?'<text x="42" y="1069" font-family="Arial,Malgun Gothic,sans-serif" font-size="11" fill="#8a9488">R 추적 로봇 · 점선 순찰 · 선 위 화살표 이동 방향 · T1 고정 회전</text>':'';return `<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#f4f2ec"/><text x="42" y="45" font-family="Arial,Malgun Gothic,sans-serif" font-size="24" font-weight="600" fill="#303a34">BLACKOUT / ${esc(title)}</text><text x="1695" y="43" font-family="Arial,Malgun Gothic,sans-serif" font-size="14" fill="#8a9488">${draft}</text><path d="M42 63H1878" stroke="#d5dacd"/><svg x="16" y="82" width="1888" height="966" viewBox="${state.view.join(' ')}">${inner}</svg>${key}</svg>`;}
async function exportPNG(){const btn=$('export'),label=btn.querySelector('span:last-child');btn.disabled=true;label.textContent='저장 중…';let url;try{url=URL.createObjectURL(new Blob([exportSVG()],{type:'image/svg+xml;charset=utf-8'}));const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url;});const canvas=document.createElement('canvas');canvas.width=2560;canvas.height=1440;canvas.getContext('2d').drawImage(img,0,0,2560,1440);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw new Error('PNG export failed');const downloadURL=URL.createObjectURL(blob),a=document.createElement('a');a.href=downloadURL;a.download=`BLACKOUT-${state.floor}F-${state.zone}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(downloadURL),1000);$('status').textContent='현재 도면의 PNG를 저장했습니다 · 2560 × 1440';}catch(error){$('status').textContent='이미지 저장에 실패했습니다. 다시 시도해 주세요.';console.error(error);}finally{if(url)URL.revokeObjectURL(url);btn.disabled=false;label.textContent='PNG 저장';}}
$('export').addEventListener('click',exportPNG);
render();if(state.zone!=='all')setView(zoneInfo[state.zone].bounds.slice());
window.BLACKOUTPlan={getState:()=>({floor:state.floor,zone:state.zone,layers:[...state.layers],view:state.view.slice()}),exportSVG,transport:JSON.parse(JSON.stringify(transport))};
})();
</script>
